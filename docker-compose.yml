version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reint-wind-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:5173","http://127.0.0.1:3000","http://127.0.0.1:5173","*"]
    volumes:
      - ./backend/app:/app/app
    restart: unless-stopped
    networks:
      - reint-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reint-wind-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - reint-network

networks:
  reint-network:
    driver: bridge
